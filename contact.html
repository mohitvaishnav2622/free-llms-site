<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FreeLLMs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">FreeLLMs</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-primary ms-lg-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h1 class="display-5 fw-bold mb-4">Get In <span style="color: var(--primary-color);">Touch</span></h1>
                    <p class="text-secondary mb-4">Have a question or a partnership proposal? We'd love to hear from you.</p>
                    <div class="mb-3">
                        <h5 class="fw-bold">Email</h5>
                        <p class="text-secondary">support@freellms.ai</p>
                    </div>
                    <div class="mb-3">
                        <h5 class="fw-bold">Office</h5>
                        <p class="text-secondary">AI Hub, Silicon Valley, CA</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-4">
                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="john@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" rows="5" placeholder="How can we help?" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer mt-5">
        <div class="container text-center">
            <p class="text-secondary">&copy; 2026 FreeLLMs Project. Developed for Internship Report.</p>
            <div class="social-links">
                <a href="#" class="text-secondary mx-2 text-decoration-none">GitHub</a>
                <a href="#" class="text-secondary mx-2 text-decoration-none">Twitter</a>
                <a href="#" class="text-secondary mx-2 text-decoration-none">LinkedIn</a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
